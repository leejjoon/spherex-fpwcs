[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spherex-fpwcs"
version = "0.1.0"
description = "Star-free WCS repair for SPHEREx Level-2 images from the six-detector focal-plane geometry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jae-Joon Lee" }]
dependencies = ["numpy>=1.24", "astropy>=5.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/leejjoon/spherex-fpwcs"

[project.scripts]
spherex-fpwcs = "spherex_fpwcs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spherex_fpwcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs access to the public SPHEREx S3 bucket"]
